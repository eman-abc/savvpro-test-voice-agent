[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# The database URL comes from DATABASE_URL via app settings (see migrations/env.py).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
